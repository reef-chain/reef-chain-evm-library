harness = false
[dependencies.codec]
version = "3.0.0"
features = ["derive"]
optional = true
default-features = false
package = "parity-scale-codec"

[dependencies.environmental]
version = "1.1.2"
optional = true
default-features = false

[dependencies.ethereum]
version = "0.14"
default-features = false

[dependencies.evm-core]
path="../evm-core-0.30.0"
default-features = false

[dependencies.evm-gasometer]
path="../evm-gasometer-0.30.0"
default-features = false

[dependencies.evm-runtime]
path="../evm-runtime-0.30.0"
default-features = false

[dependencies.log]
version = "0.4.17"
default-features = false

[dependencies.primitive-types]
version = "0.12"
features = ["rlp","scale-info","codec"]
default-features = false

[dependencies.scale-info]
version = "0.10"
features = ["derive"]
default-features = false

[dependencies.rlp]
version = "0.5"
default-features = false

[dependencies.serde]
version = "1.0"
features = ["derive"]
optional = true
default-features = false

[dependencies.sha3]
version = "0.8"
default-features = false
[dev-dependencies.criterion]
version = "0.3"

[dev-dependencies.hex]
